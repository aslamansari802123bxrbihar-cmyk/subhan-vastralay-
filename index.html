<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Subhan Vastralay</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px 14px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:25px;
}

header p{
  font-size:13px;
  margin-top:5px;
  color:#d1d5db;
}

.search{
  padding:12px;
  background:white;
}

.search input{
  width:100%;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 12px;
  background:white;
}

.categories button{
  white-space:nowrap;
  border:0;
  padding:9px 14px;
  border-radius:20px;
  background:#e5e7eb;
  cursor:pointer;
}

.categories button.active{
  background:#111827;
  color:white;
}

.cartbar{
  margin:12px;
  padding:13px;
  border-radius:12px;
  background:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 8px #00000012;
}

.cartbar button{
  background:#111827;
  color:white;
  border:0;
  padding:10px 14px;
  border-radius:9px;
  cursor:pointer;
}

.products{
  padding:0 12px 25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px #00000012;
}

.photo{
  height:170px;
  background:linear-gradient(135deg,#e5e7eb,#f9fafb);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#6b7280;
  font-size:13px;
}

.info{
  padding:11px;
}

.info h3{
  font-size:15px;
  line-height:20px;
  min-height:40px;
}

.price{
  margin:7px 0 10px;
  font-size:18px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:7px;
}

.actions button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:9px 4px;
  font-size:12px;
  cursor:pointer;
}

.cartbtn{
  background:#e5e7eb;
  color:#111827;
}

.buybtn{
  background:#111827;
  color:white;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#6b7280;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#00000080;
  z-index:100;
  align-items:flex-end;
  justify-content:center;
}

.modalbox{
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:20px 20px 0 0;
  padding:20px;
}

.modalbox h2{
  margin-bottom:14px;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:32px;
  height:32px;
  cursor:pointer;
}

.cartitem{
  padding:10px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.remove{
  border:0;
  background:#fee2e2;
  color:#b91c1c;
  padding:5px 8px;
  border-radius:6px;
}

.total{
  font-size:19px;
  font-weight:bold;
  margin:15px 0;
}

form input,
form textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

form textarea{
  height:80px;
  resize:none;
}

.whatsapp{
  width:100%;
  border:0;
  padding:13px;
  background:#16a34a;
  color:white;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
  margin-top:8px;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#6b7280;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🛍️ Subhan Vastralay</h1>
  <p>Kapde • Ladies • Footwear • Accessories • Beauty</p>
</header>

<div class="search">
  <input
    id="search"
    type="text"
    placeholder="Samaan search karein..."
  >
</div>

<div class="categories">

  <button
    class="active"
    onclick="filterCategory('All',this)">
    All
  </button>

  <button
    onclick="filterCategory('Kapde',this)">
    Kapde
  </button>

  <button
    onclick="filterCategory('Ladies',this)">
    Ladies
  </button>

  <button
    onclick="filterCategory('Footwear',this)">
    Footwear
  </button>

  <button
    onclick="filterCategory('Accessories',this)">
    Accessories
  </button>

  <button
    onclick="filterCategory('Beauty',this)">
    Beauty
  </button>

  <button
    onclick="filterCategory('General',this)">
    General
  </button>

</div>

<div class="cartbar">

  <span>
    🛒 Cart:
    <b id="cartCount">0</b>
    item
  </span>

  <button onclick="openCart()">
    Cart Dekhein
  </button>

</div>

<div id="products" class="products"></div>

<footer>
  © 2026 Subhan Vastralay
  <br>
  Aapka apna kapde aur fashion store ❤️
</footer>


<!-- ORDER MODAL -->

<div id="modal" class="modal">

  <div class="modalbox">

    <button
      class="close"
      onclick="closeModal()">
      ×
    </button>

    <h2>🛒 Aapka Order</h2>

    <div id="cartItems"></div>

    <div
      id="cartTotal"
      class="total">
    </div>

    <form onsubmit="sendOrder(event)">

      <input
        id="customerName"
        required
        placeholder="Aapka naam"
      >

      <input
        id="customerMobile"
        required
        type="tel"
        placeholder="Mobile number"
      >

      <textarea
        id="customerNote"
        placeholder="Size / colour / koi note">
      </textarea>

      <button
        class="whatsapp"
        type="submit">
        📲 WhatsApp par Order Bhejein
      </button>

    </form>

  </div>

</div>


<script>

/* =====================================
   SUBHAN VASTRALAY
   WHATSAPP NUMBER
===================================== */

const WHATSAPP_NUMBER = "917033379080";


/* =====================================
   PRODUCTS

   Baad mein isi list mein naye
   products bahut aasani se add honge.

   Har product ka:
   id
   name
   price
   category
   image

   alag ho sakta hai.
===================================== */

const products = [

  {
    id:1,
    name:"Royal Braso Saree",
    price:850,
    category:"Ladies",
    image:""
  },

  {
    id:2,
    name:"Royal Braso Saree - Siddhima",
    price:750,
    category:"Ladies",
    image:""
  },

  {
    id:3,
    name:"Kiss-Miss Saree",
    price:650,
    category:"Ladies",
    image:""
  },

  {
    id:4,
    name:"Peacock Green Silk Saree",
    price:650,
    category:"Ladies",
    image:""
  },

  {
    id:5,
    name:"Royal Blue Saree",
    price:580,
    category:"Ladies",
    image:""
  },

  {
    id:6,
    name:"Subhan Vastralay Saree",
    price:550,
    category:"Ladies",
    image:""
  },

  {
    id:7,
    name:"VIP Bond Wind Drawer",
    price:95,
    category:"Kapde",
    image:""
  },

  {
    id:8,
    name:"Sendo Ganji",
    price:120,
    category:"Kapde",
    image:""
  },

  {
    id:9,
    name:"Half Ladies Top",
    price:150,
    category:"Ladies",
    image:""
  },

  {
    id:10,
    name:"Ladies Underwear",
    price:80,
    category:"Ladies",
    image:""
  },

  {
    id:11,
    name:"Ladies Slippers",
    price:120,
    category:"Footwear",
    image:""
  }

];


/* =====================================
   CART
===================================== */

let cart = [];

let currentCategory = "All";


/* =====================================
   SHOW PRODUCTS
===================================== */

function renderProducts(){

  const box =
    document.getElementById("products");

  const searchText =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(product => {

      const categoryMatch =
        currentCategory === "All" ||
        product.category === currentCategory;

      const searchMatch =
        product.name
          .toLowerCase()
          .includes(searchText);

      return categoryMatch && searchMatch;

    });


  box.innerHTML = "";


  if(filtered.length === 0){

    box.innerHTML =
      '<div class="empty">😕 Samaan nahi mila</div>';

    return;
  }


  filtered.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "card";


    let photoHTML = "";

    if(product.image){

      photoHTML = `
        <img
          src="${product.image}"
          alt="${product.name}"
          style="
            width:100%;
            height:170px;
            object-fit:cover;
          "
        >
      `;

    }else{

      photoHTML = `
        <div class="photo">
          📷 Product Photo
        </div>
      `;

    }


    card.innerHTML = `

      ${photoHTML}

      <div class="info">

        <h3>
          ${product.name}
        </h3>

        <div class="price">
          ₹${product.price}
        </div>

        <div class="actions">

          <button
            class="cartbtn"
            onclick="addToCart(${product.id})">
            🛒 Cart
          </button>

          <button
            class="buybtn"
            onclick="buyNow(${product.id})">
            🛍️ Buy Now
          </button>

        </div>

      </div>

    `;


    box.appendChild(card);

  });

}


/* =====================================
   CATEGORY
===================================== */

function filterCategory(category,button){

  currentCategory = category;


  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  button.classList.add("active");


  renderProducts();

}


/* =====================================
   SEARCH
===================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderProducts
  );


/* =====================================
   ADD CART
===================================== */

function addToCart(id){

  const product =
    products.find(p => p.id === id);


  const existing =
    cart.find(p => p.id === id);


  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }


  updateCart();


  alert(
    "✅ Samaan cart mein add ho gaya"
  );

}


/* =====================================
   BUY NOW
===================================== */

function buyNow(id){

  cart = [];


  const product =
    products.find(p => p.id === id);


  cart.push({
    ...product,
    qty:1
  });


  updateCart();

  openCart();

}


/* =====================================
   CART COUNT
===================================== */

function updateCart(){

  const count =
    cart.reduce(
      (sum,product) =>
        sum + product.qty,
      0
    );


  document
    .getElementById("cartCount")
    .textContent = count;

}


/* =====================================
   OPEN CART
===================================== */

function openCart(){

  renderCart();


  document
    .getElementById("modal")
    .style.display = "flex";

}


/* =====================================
   CLOSE CART
===================================== */

function closeModal(){

  document
    .getElementById("modal")
    .style.display = "none";

}


/* =====================================
   RENDER CART
===================================== */

function renderCart(){

  const box =
    document.getElementById("cartItems");

  const totalBox =
    document.getElementById("cartTotal");


  box.innerHTML = "";


  if(cart.length === 0){

    box.innerHTML =
      "<p>Cart abhi khaali hai.</p>";

    totalBox.textContent = "";

    return;

  }


  let total = 0;


  cart.forEach(item => {

    const amount =
      item.price * item.qty;


    total += amount;


    const div =
      document.createElement("div");


    div.className = "cartitem";


    div.innerHTML = `

      <div>

        <b>
          ${item.name}
        </b>

        <br>

        ₹${item.price}
        × ${item.qty}

      </div>

      <button
        class="remove"
        onclick="removeFromCart(${item.id})">
        Hatao
      </button>

    `;


    box.appendChild(div);

  });


  totalBox.textContent =
    "Total: ₹" + total;

}


/* =====================================
   REMOVE CART ITEM
===================================== */

function removeFromCart(id){

  cart =
    cart.filter(
      product => product.id !== id
    );


  updateCart();

  renderCart();

}


/* =====================================
   WHATSAPP ORDER
===================================== */

function sendOrder(event){

  event.preventDefault();


  if(cart.length === 0){

    alert(
      "Pehle koi samaan select karein."
    );

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value;


  const mobile =
    document
      .getElementById("customerMobile")
      .value;


  const note =
    document
      .getElementById("customerNote")
      .value;


  let message =
    "🛍️ *SUBHAN VASTRALAY ORDER*%0A%0A";


  message +=
    "👤 Naam: " +
    encodeURIComponent(name) +
    "%0A";


  message +=
    "📱 Mobile: " +
    encodeURIComponent(mobile) +
    "%0A%0A";


  message +=
    "🛒 *Samaan:*%0A";


  let total = 0;


  cart.forEach(item => {

    const amount =
      item.price * item.qty;


    total += amount;


    message +=
      "• " +
      encodeURIComponent(item.name) +
      " × " +
      item.qty +
      " = ₹" +
      amount +
      "%0A";

  });


  message +=
    "%0A💰 *Total: ₹" +
    total +
    "*%0A";


  if(note.trim() !== ""){

    message +=
      "📝 Note: " +
      encodeURIComponent(note) +
      "%0A";

  }


  message +=
    "%0AThank you ❤️";


  const whatsappURL =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    message;


  window.open(
    whatsappURL,
    "_blank"
  );

}


/* =====================================
   START APP
===================================== */

renderProducts();

updateCart();

</script>

</body>
</html>
