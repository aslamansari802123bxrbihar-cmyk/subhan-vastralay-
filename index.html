<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Subhan Vastralay</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Subhan Vastralay</h1>
    <p>Kapde aur Fashion ka samaan</p>
  </header>

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Samaan search karein..."
    >
  </div>

  <div class="categories">
    <button data-category="All" class="active">All</button>
    <button data-category="Kapde">Kapde</button>
    <button data-category="Ladies">Ladies</button>
    <button data-category="Footwear">Footwear</button>
    <button data-category="Accessories">Accessories</button>
    <button data-category="Beauty">Beauty</button>
    <button data-category="General">General</button>
  </div>

  <main>
    <div id="productGrid"></div>
  </main>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script src="script.js"></script>

</body>
</html>
